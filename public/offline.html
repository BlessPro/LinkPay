<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline • 8Kommerce</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ecfdf5, #f8fafc);
      color: #0f172a;
    }
    .card {
      width: min(92vw, 460px);
      background: #ffffff;
      border: 1px solid #d1fae5;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 15px 30px rgba(15, 23, 42, 0.1);
    }
    h1 { margin: 0 0 10px; font-size: 1.35rem; }
    p { margin: 0 0 16px; color: #334155; line-height: 1.5; }
    a {
      display: inline-block;
      border-radius: 999px;
      background: #059669;
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>8Kommerce could not load this page without internet. Reconnect and try again.</p>
    <a href="/">Retry</a>
  </div>
  <script>
    try {
      localStorage.setItem('lp_offline_hit', new Date().toISOString());
    } catch (_) {}
  </script>
</body>
</html>
